[project]
name = "delphi-backend"
version = "1.0.0"
description = "Delphi Educational Platform Backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.123.9",
    "uvicorn[standard]>=0.32.1",
    "sqlmodel>=0.0.27",
    "sqlalchemy>=2.0.44",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.1",
    "passlib>=1.7.4",
    "python-multipart>=0.0.20",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "google-generativeai>=0.8.3",
    "email-validator>=2.3.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "ruff>=0.14.8",
    "resend>=2.30.0",
    "celery>=5.6.3",
    "redis>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
